<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🚤 Minibot Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body {
    background: radial-gradient(circle at 20% 10%, #1b1b4b 0%, #0f0c29 40%, #050510 100%);
    color:#fff; min-height:100vh; padding:24px;
  }
  .container { max-width:1280px; margin:auto; }
  header { text-align:center; padding:16px 0 32px; }
  header h1 {
    font-size:2.6rem; font-weight:800; letter-spacing:1px;
    background:linear-gradient(90deg,#00e0ff,#7b5cff,#ff4bd8);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  header p { color:#8a8ab5; margin-top:8px; font-size:.95rem; }
  .live {
    display:inline-flex; align-items:center; gap:8px;
    background:rgba(0,255,136,.08); border:1px solid rgba(0,255,136,.3);
    padding:6px 14px; border-radius:20px; font-size:.8rem; color:#00ff88;
    margin-top:12px;
  }
  .live::before {
    content:''; width:8px; height:8px; border-radius:50%;
    background:#00ff88; box-shadow:0 0 10px #00ff88;
    animation:pulse 1.5s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .stats {
    display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px; margin-bottom:28px;
  }
  .card {
    background:linear-gradient(145deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px; padding:22px;
    position:relative; overflow:hidden;
    transition:transform .3s, box-shadow .3s;
  }
  .card:hover { transform:translateY(-5px); box-shadow:0 15px 40px rgba(0,180,255,.15); }
  .card::before {
    content:''; position:absolute; inset:0 auto 0 0; width:4px;
    background:linear-gradient(180deg,#00e0ff,#7b5cff);
  }
  .card.green::before { background:linear-gradient(180deg,#00ff88,#00b36b); }
  .card.red::before   { background:linear-gradient(180deg,#ff4b5c,#b31f2c); }
  .card.yellow::before{ background:linear-gradient(180deg,#ffc107,#e08e00); }
  .card .label { font-size:.78rem; color:#9a9ac0; letter-spacing:1.5px; text-transform:uppercase; }
  .card .value { font-size:2.6rem; font-weight:800; margin-top:10px; line-height:1; }
  .card.green  .value { color:#00ff88; }
  .card.red    .value { color:#ff4b5c; }
  .card.yellow .value { color:#ffc107; }
  .card .icon { position:absolute; right:18px; top:18px; font-size:2rem; opacity:.18; }
  .section {
    background:linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px; padding:26px; margin-bottom:24px;
  }
  .section h2 {
    margin-bottom:20px; font-size:1.25rem; font-weight:700;
    display:flex; align-items:center; gap:12px;
  }
  .section h2::before {
    content:''; width:6px; height:22px; border-radius:3px;
    background:linear-gradient(180deg,#00e0ff,#7b5cff);
  }
  canvas { max-height:340px; }
  .table-wrap { overflow-x:auto; border-radius:12px; }
  table { width:100%; border-collapse:collapse; min-width:640px; }
  th,td { padding:14px 12px; text-align:left; border-bottom:1px solid rgba(255,255,255,.07); }
  th { color:#8a8ab5; font-size:.75rem; text-transform:uppercase; letter-spacing:1.2px; font-weight:600; }
  tbody tr { transition:background .2s; }
  tbody tr:hover { background:rgba(0,224,255,.05); }
  .badge { padding:5px 14px; border-radius:20px; font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .badge.online  { background:rgba(0,255,136,.12); color:#00ff88; border:1px solid rgba(0,255,136,.35); }
  .badge.offline { background:rgba(255,75,92,.12); color:#ff4b5c; border:1px solid rgba(255,75,92,.35); }
  .speed-cell { display:flex; align-items:center; gap:12px; }
  .speed-bar { width:110px; height:8px; background:rgba(255,255,255,.08); border-radius:4px; overflow:hidden; }
  .speed-bar span { display:block; height:100%; border-radius:4px;
    background:linear-gradient(90deg,#00e0ff,#00ff88); transition:width .6s ease; }
  .speed-val { font-weight:700; color:#00e0ff; min-width:80px; }
  .empty { text-align:center; padding:40px; color:#666; font-style:italic; }
  @media (max-width:600px) {
    header h1 { font-size:1.7rem; }
    .card .value { font-size:2rem; }
    body { padding:14px; }
    .section { padding:18px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🚤 Minibot Dashboard</h1>
    <p>MongoDB Atlas — Live Data</p>
    <div class="live">LIVE</div>
  </header>
  <div class="stats">
    <div class="card"><div class="icon">🤖</div><div class="label">Total Bots</div><div class="value" id="totalBots">0</div></div>
    <div class="card green"><div class="icon">🟢</div><div class="label">Online</div><div class="value" id="onlineBots">0</div></div>
    <div class="card red"><div class="icon">🔴</div><div class="label">Offline</div><div class="value" id="offlineBots">0</div></div>
    <div class="card yellow"><div class="icon">⚡</div><div class="label">Avg Speed (km/h)</div><div class="value" id="avgSpeed">0</div></div>
  </div>
  <div class="section">
    <h2>📊 Bot Speed Chart</h2>
    <canvas id="speedChart"></canvas>
  </div>
  <div class="section">
    <h2>🤖 Bot List</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Bot ID</th><th>Name</th><th>Speed</th><th>Status</th></tr></thead>
        <tbody id="botTable"><tr><td colspan="4" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const ctx = document.getElementById('speedChart').getContext('2d');
const grad = ctx.createLinearGradient(0, 0, 0, 340);
grad.addColorStop(0, 'rgba(0,224,255,0.65)');
grad.addColorStop(1, 'rgba(0,224,255,0.05)');
const speedChart = new Chart(ctx, {
  type: 'bar',
  data: { labels: [], datasets: [{ label: 'Speed (km/h)', data: [], backgroundColor: grad,
    borderColor: '#00e0ff', borderWidth: 2, borderRadius: 8, borderSkipped: false }] },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { labels: { color: '#fff', font: { size: 13 } } },
      tooltip: { backgroundColor: 'rgba(10,10,30,.95)', borderColor: '#00e0ff',
        borderWidth: 1, padding: 12, titleColor: '#00e0ff' } },
    scales: {
      x: { ticks: { color: '#a0a0c0', font: { size: 12 } }, grid: { color: 'rgba(255,255,255,0.05)' } },
      y: { beginAtZero: true, ticks: { color: '#a0a0c0', font: { size: 12 } }, grid: { color: 'rgba(255,255,255,0.05)' } }
    }
  }
});
async function loadData() {
  try {
    const res = await fetch('/api/bots');
    const data = await res.json();
    document.getElementById('totalBots').textContent   = data.total;
    document.getElementById('onlineBots').textContent  = data.online;
    document.getElementById('offlineBots').textContent = data.offline;
    document.getElementById('avgSpeed').textContent    = data.avgSpeed;
    speedChart.data.labels = data.bots.map(b => b.name || b.id);
    speedChart.data.datasets[0].data = data.bots.map(b => b.speed);
    speedChart.update();
    const tbody = document.getElementById('botTable');
    if (!data.bots.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">MongoDB එකේ bots නෑ</td></tr>';
      return;
    }
    const maxSpeed = Math.max(...data.bots.map(b => b.speed), 1);
    tbody.innerHTML = data.bots.map(b => {
      const pct = (b.speed / maxSpeed) * 100;
      const status = String(b.status).toLowerCase() === 'online' ? 'online' : 'offline';
      return `<tr>
        <td><strong>${b.id}</strong></td>
        <td>${b.name}</td>
        <td><div class="speed-cell"><div class="speed-bar"><span style="width:${pct}%"></span></div>
          <span class="speed-val">${b.speed.toFixed(1)} km/h</span></div></td>
        <td><span class="badge ${status}">${b.status}</span></td>
      </tr>`;
    }).join('');
  } catch (err) { console.error('Load error:', err); }
}
loadData();
setInterval(loadData, 5000);
</script>
</body>
</html>
